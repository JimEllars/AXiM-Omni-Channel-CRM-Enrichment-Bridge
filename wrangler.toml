name = "omni-crm-bridge-prod"
main = "src/index.js"
compatibility_date = "2024-03-01"

# KV Namespace Binding for Deduplication
[[kv_namespaces]]
binding = "CRM_BRIDGE_DEDUPE"
id = "<PLACEHOLDER_DEDUPE_ID>"

[[kv_namespaces]]
binding = "CRM_BRIDGE_ROUTING_RULES"
id = "<PLACEHOLDER_ROUTING_RULES_ID>"

# Note: Secrets like AXIM_INTERNAL_KEY and ALBATO_WEBHOOK_URL 
# should be added via `wrangler secret put <KEY_NAME>`

[triggers]
crons = ["0 2 * * *"]

[ai]
binding = "AI"
